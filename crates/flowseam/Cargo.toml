[package]
name = "flowseam"
version = "0.1.2"
license = "MIT"
edition = "2021"

[[bin]]
name = "flowseam"
path = "src/main.rs"

[dependencies]
flowseam-core = { path = "../flowseam-core" }
flowseam-net = { path = "../flowseam-net" }
eframe = { version = "=0.37.0", features = ["wgpu"] }
serde_json = "=1.0.145"
tray-icon = { version = "=0.21.2", default-features = false }
muda = { version = "=0.17.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
flowseam-mac = { path = "../flowseam-mac" }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", features = ["NSApplication", "NSRunningApplication"] }

[target.'cfg(windows)'.dependencies]
flowseam-win = { path = "../flowseam-win" }
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading"] }

[dev-dependencies]
regex = "=1.12.2"
