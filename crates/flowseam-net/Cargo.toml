[package]
name = "flowseam-net"
version = "0.1.1"
license = "MIT"
edition = "2021"

[dependencies]
flowseam-core = { path = "../flowseam-core" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
sha2 = "0.10"
# Pairing: SPAKE2 (RustCrypto, 0.4.0 stable; 0.5.0-pre.0 is a pre-release) with
# the 6-digit code as the password. OsRng comes from rand_core via getrandom.
spake2 = "0.4"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
